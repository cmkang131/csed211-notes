<section>
<div class="problem">
<span class="prob-no">문제 1</span>
<p>~와 &amp;만 사용해 x | y를 구현하라. 연산 개수는?</p>
</div>
</section>
<section>
<details class="pd"><summary>힌트 보기</summary>
<div class="pd-body"><div class="bx">
드모르간 법칙 — &amp;과 ~만으로 |를 만들 수 있다: ~(A &amp; B) = ~A | ~B. 양변에 ~를 한 번 더 씌워 보기.
</div></div>
